# the fork's CI, for SWTOR on Mac's DirectX 12 client: the one build the app installs (x86_64
# Windows DLLs and the x86_64 winemetal.so, release, NVAPI and NGX off), its checks and the host
# tests, and for a push to swtor-on-mac the archive of that build on the pre-release swtor-builds.
# docs/swtor/README.md § CI and § Releases say what it leaves out and why. Shaped after jdrly/dxmt's
# gw2.yml.
#
# runner time: GitHub has blocked two of my forks for wasted compute, so: one run at a time for each
# branch, queued and never cancelled in progress; no schedule; nothing but this one build; caches
# saved only on a miss; a push run builds and uploads but doesn't repeat the tests, the control or
# the warnings check that the pull request's run of the same tree passed.
name: SWTOR

on:
  pull_request:
    branches: [swtor-on-mac]
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [swtor-on-mac]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

# one group for each branch: a pull request's, and swtor-on-mac's for the push runs. A run in progress is
# never cancelled; GitHub keeps one run waiting behind it and cancels an older waiting run when a newer one of
# the same group arrives, before it gets a runner. So a new push to a pull request replaces only that pull
# request's waiting run, never another's or a push run. One group for the whole repository dropped the push
# runs of a40ddb4 and 88d5a9f that way, and their builds were never published
concurrency:
  group: swtor-${{ github.ref }}
  cancel-in-progress: false

env:
  # the PR's own commit, not GitHub's merge commit, so the artifact and VERSION name it
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  XCODE_VERSION: "27.2"
  # meson.build's -mmacosx-version-min for the native side, which LLVM is linked into
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  MESON_VERSION: 1.12.1
  NINJA_VERSION: 1.13.0
  LLVM_VERSION: 15.0.7
  LLVM_SHA256: 8b5fcb24b4128cf04df1b0b9410ce8b1a729cb3c544e6da885d234280dedeac6
  # llvm/LICENSE.TXT at llvmorg-$LLVM_VERSION: airconv links LLVM into winemetal.so. llvm-mingw's LICENSE.TXT, for the
  # libc++ linked into the DLLs, is the same file
  LLVM_LICENSE_SHA256: 8d85c1057d742e597985c7d4e6320b015a9139385cff4cbae06ffc0ebe89afee
  # raise it when toolchain.zsh builds LLVM differently, so the cache doesn't keep the old build
  LLVM_BUILD: 1
  LLVM_MINGW_VERSION: "20260908"
  LLVM_MINGW_SHA256: d1dc5d1ecf3a3ced5ed5544c72f1acd0c8e84eb3024d520ecc6b143eec62a149
  WINE_VERSION: v8.16-3shain
  WINE_SHA256: 289c7f19e270a3d3d0a6fdb07691b176c70a0795f6811e5255cba82425de4f10

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$f"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$f" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/swtor.yml

  build:
    name: Build x86_64
    runs-on: xcode-27
    timeout-minutes: 120
    outputs:
      date: ${{ steps.stage.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          # the history and upstream's tags, for git describe (VERSION, and the version meson builds in)
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          # airconv's and the command library's .metal sources need it; Xcode 26 and later ship without it
          xcrun -f metal >/dev/null 2>&1 || { echo "Downloading the Metal toolchain"; xcodebuild -downloadComponent MetalToolchain; }
      - name: Install meson
        run: pip3 install --break-system-packages "meson==$MESON_VERSION" "ninja==$NINJA_VERSION"
      - name: Script syntax
        run: for f in .github/swtor/*.zsh; do zsh -n "$f"; echo "ok $f"; done

      - name: Restore Wine
        id: wine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}
          path: toolchains/wine
      - name: Download Wine
        if: steps.wine.outputs.cache-hit != 'true'
        run: .github/swtor/toolchain.zsh fetch "https://github.com/3Shain/wine/releases/download/$WINE_VERSION/wine.tar.gz" "$WINE_SHA256" toolchains/wine
      - name: Save Wine
        if: steps.wine.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}
          path: toolchains/wine

      - name: Restore llvm-mingw
        id: mingw
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}
          path: toolchains/llvm-mingw
      - name: Download llvm-mingw
        if: steps.mingw.outputs.cache-hit != 'true'
        run: .github/swtor/toolchain.zsh fetch "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-macos-universal.tar.xz" "$LLVM_MINGW_SHA256" toolchains/llvm-mingw --strip-components 1
      - name: Save llvm-mingw
        if: steps.mingw.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}
          path: toolchains/llvm-mingw

      # about 25 minutes on a miss; a pull request's cache serves only that pull request, so the first push to
      # swtor-on-mac after a toolchain change builds it once more
      - name: Restore LLVM
        id: llvm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ env.LLVM_BUILD }}
          path: toolchains/llvm
      - name: Build LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        run: .github/swtor/toolchain.zsh llvm toolchains/llvm
      - name: Save LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ env.LLVM_BUILD }}
          path: toolchains/llvm

      - name: Toolchain versions
        run: |
          # appended: llvm-mingw's unprefixed clang mustn't replace Apple's, which builds the native side
          export PATH="$PATH:$PWD/toolchains/llvm-mingw/bin"
          # and no other mingw on the image may build the DLLs instead
          [[ $(command -v x86_64-w64-mingw32-gcc) == "$PWD/toolchains/llvm-mingw/bin/x86_64-w64-mingw32-gcc" ]]
          {
            echo '### Toolchain'
            echo '```'
            xcodebuild -version
            echo "macOS SDK $(xcrun -sdk macosx --show-sdk-version)"
            xcrun -sdk macosx metal --version
            x86_64-w64-mingw32-gcc --version | head -1
            echo "llvm-mingw $LLVM_MINGW_VERSION, LLVM $LLVM_VERSION (build $LLVM_BUILD, macOS $MACOSX_DEPLOYMENT_TARGET, no assertions), Wine $WINE_VERSION"
            echo "meson $(meson --version), ninja $(ninja --version)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          export PATH="$PATH:$PWD/toolchains/llvm-mingw/bin"
          # relative: meson refuses an absolute include path inside the source tree
          meson setup build --cross-file build-win64.txt --buildtype release --strip --prefix "$PWD/install" \
            -Denable_d3d12=true -Denable_nvapi=false -Denable_nvngx=false \
            -Dnative_llvm_path=toolchains/llvm -Dwine_install_path=toolchains/wine
          meson compile -C build 2>&1 | tee build.log

      - name: Stage
        id: stage
        run: |
          # --strip runs x86_64-w64-mingw32-strip on the DLLs
          export PATH="$PATH:$PWD/toolchains/llvm-mingw/bin"
          meson install -C build --no-rebuild --quiet
          rm -f install/*/*.dll.a
          # Apple's linker signs only arm64 binaries by itself
          codesign --force --sign - install/x86_64-unix/winemetal.so
          {
            # v0.5-alpha.3-<n>-g<hash>: upstream's last v tag. swtor-builds is a lightweight tag, which it skips
            git -c diff.ignoreSubmodules=all describe --always --dirty
            echo "commit: $COMMIT"
            # the first 12 digits of the converter's codegen id, which keys the shader cache, as the cacheOpen line and
            # the session header print it; then the hand-raised number upstream keeps
            echo "codegen: $(sed -n 's/^#define MULLION_CODEGEN_ID "\([0-9a-f]\{12\}\).*/\1/p' build/mullion_codegen.h)" \
              "(airconv $(sed -n 's/^#define AIRCONV_VERSION //p' src/airconv/airconv_public.h))"
            echo "toolchain: $(xcodebuild -version | paste -sd ' ' -), macOS SDK $(xcrun -sdk macosx --show-sdk-version)," \
              "$(xcrun -sdk macosx metal --version | sed -n 1p), LLVM $LLVM_VERSION without assertions," \
              "llvm-mingw $LLVM_MINGW_VERSION ($(x86_64-w64-mingw32-gcc --version | sed -n 1p))"
            echo "built: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >install/VERSION
          # LGPL 2.1: where the source of what ships is
          {
            echo "The source of these files, under the GNU Lesser General Public License 2.1 (LICENSE):"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY at commit $COMMIT, with its submodules"
          } >install/SOURCE
          cp LICENSE install/
          cp -R docs/licenses install/licenses
          # the DLLs link the MinGW-w64 runtime statically (meson.build's -static); its notices travel with it
          cp -R toolchains/llvm-mingw/x86_64-w64-mingw32/share/mingw32 install/licenses/mingw-w64
          curl -fsSL --retry 3 -o install/LICENSE-LLVM.txt \
            "https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-$LLVM_VERSION/llvm/LICENSE.TXT"
          echo "$LLVM_LICENSE_SHA256  install/LICENSE-LLVM.txt" | shasum -a 256 -c
          cat install/VERSION
          find install -type f | sort
          # the archive's files carry the commit's time
          echo "date=$(git log -1 --format=%cI)" >>"$GITHUB_OUTPUT"

      # .github/swtor/check-build.py: the file list, winemetal.so (no LLVM assertion text, minos 15.0, an ad hoc
      # signature), the internal Metal library's versions, and the converter's codegen id, computed again from the
      # checkout, in the DLLs and VERSION. a push run checks its own build: that is what ships
      - name: Check the build
        run: |
          codegen=$(python3 -I -B tools/codegen_id.py --llvm toolchains/llvm .)
          status=0
          python3 -I .github/swtor/check-build.py install "$codegen" >"$RUNNER_TEMP/check.txt" || status=$?
          cat "$RUNNER_TEMP/check.txt"
          { echo '### The build'; echo '```'; cat "$RUNNER_TEMP/check.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

      # tests/host/meson.build: thirty-one tests, each with meson's 30 s timeout but host_tessellator's
      # 300 s; none builds the tree or waits on a GPU
      - name: Host tests
        id: host
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          export PATH="$PATH:$PWD/toolchains/llvm-mingw/bin"
          meson configure build -Denable_tests=true
          # host_mutate is left out: it tests upstream's mutation and test-runner tools, not the driver, and
          # its test_runner_schedule needs two 0.5 s processes to overlap under tests/run.py's admission, which
          # reads the machine's real memory pressure; on this runner they ran one after the other (run
          # 43498464580)
          skip=(--exclude host_mutate)
          # host_tessellator takes about 200 s here (x86_64 under Rosetta), the other ten before
          # host_layer_apply about 18 s, and host_layer_apply holds its main thread for 2 s twice: it runs
          # when the pull request changes what it compiles or how, or one of its breaks, or when that can't be
          # told; its breaks run with it (next step). all of src/airconv, so that a header it comes to include
          # there can't slip past
          if git fetch -q origin "$BASE" && git diff --quiet "$BASE" HEAD -- \
            src/airconv libs/DXBCParser tests/tessellator.hpp tests/reference tests/host tests/meson.build \
            'tests/breaks/host_tessellator*' meson.build meson.options build-win64.txt .github/workflows/swtor.yml; then
            skip+=(--exclude host_tessellator)
            echo "tessellator=left-out" >>"$GITHUB_OUTPUT"
            echo "host_tessellator left out: nothing it compiles changed since $BASE" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # builds only what the host tests need, not the Windows test programs
          meson test -C build 'host_*' "${skip[@]}" --print-errorlogs

      # each host break rebuilds and runs only its own test; host_tessellator's three take about 200 s each, and run
      # only when host_tessellator ran
      - name: The checks fail on a broken copy
        if: github.event_name == 'pull_request'
        timeout-minutes: 30
        env:
          TESSELLATOR: ${{ steps.host.outputs.tessellator }}
        run: |
          export PATH="$PATH:$PWD/toolchains/llvm-mingw/bin"
          # Rc's move assignment without its self-move guard, in the checkout after staging:
          # host_rc_self_move has to fail, and on that check
          rc=src/util/rc/util_rc_ptr.hpp
          perl -pi -e 's/if \(this != &other\) \{/if (true) {/' "$rc"
          [[ $(git diff --numstat -- "$rc") == $'1\t1\t'"$rc" ]]
          status=0
          meson test -C build host_rc_self_move --print-errorlogs >"$RUNNER_TEMP/control.txt" 2>&1 || status=$?
          git checkout -- "$rc"
          cat "$RUNNER_TEMP/control.txt"
          [[ $status != 0 ]]
          grep -qF 'failed: owner.ptr() == &object' "$RUNNER_TEMP/control.txt"
          # the warnings check, given this build's log with one warning more
          cp build.log "$RUNNER_TEMP/warned.log"
          echo '../src/d3d12/control.cpp:1:1: warning: a warning no baseline lists [-Wcontrol]' >>"$RUNNER_TEMP/warned.log"
          status=0
          .github/swtor/warnings.zsh "$RUNNER_TEMP/warned.log" .github/swtor/warnings-x86_64.txt >"$RUNNER_TEMP/warned.txt" || status=$?
          [[ $status == 1 ]]
          grep -qxF '::error::New warning: src/d3d12/control.cpp: warning: a warning no baseline lists [-Wcontrol]' "$RUNNER_TEMP/warned.txt"
          # the bridge's availability guards: winemetal_unix.c with sparseResidencyInTiles' macOS 26.4 guard lowered
          # to 26.0 and a macOS 26 type used outside any guard, compiled alone for the build's target (15.0). the
          # warnings check has to name both
          wm=src/winemetal/unix/winemetal_unix.c
          perl -pi -e 's/if \(\@available\(macOS 26\.4, \*\)\) \{/if (\@available(macOS 26.0, *)) {/' "$wm"
          echo '_Static_assert(sizeof(MTL4CopySparseTextureMappingOperation) != 0, "");' >>"$wm"
          [[ $(git diff --numstat -- "$wm") == $'2\t1\t'"$wm" ]]
          obj=$(ninja -C build -t targets all | sed -n 's/^\([^:]*winemetal_unix\.c\.o\): .*/\1/p')
          [[ $obj == *.o && $obj != *$'\n'* ]]
          ninja -C build "$obj" >"$RUNNER_TEMP/unguarded.log" 2>&1 || true
          git checkout -- "$wm"
          status=0
          .github/swtor/warnings.zsh "$RUNNER_TEMP/unguarded.log" .github/swtor/warnings-x86_64.txt >"$RUNNER_TEMP/unguarded.txt" || status=$?
          # only its new warnings, and not as workflow commands: GitHub would annotate every pull request with them,
          # and with a "Gone" notice for each baseline warning of the files this compile left out
          sed -n 's/^::error::New warning: /control, new warning: /p' "$RUNNER_TEMP/unguarded.txt"
          [[ $status == 1 ]]
          grep -qxF "::error::New warning: $wm: warning: 'supportsPlacementSparse' is only available on macOS 26.4 or newer [-Wunguarded-availability-new]" "$RUNNER_TEMP/unguarded.txt"
          grep -qxF "::error::New warning: $wm: warning: 'MTL4CopySparseTextureMappingOperation' is only available on macOS 26.0 or newer [-Wunguarded-availability-new]" "$RUNNER_TEMP/unguarded.txt"
          # the build checks, given a copy of the build with a file it doesn't ship and without SOURCE, its
          # winemetal.so unsigned, with an LLVM source path appended and minos 26.0 (LC_BUILD_VERSION), and
          # d3d12core.dll's internal Metal library tagged 2.9 with its first function AIR 2.9
          b=$RUNNER_TEMP/broken
          cp -R install "$b"
          cp "$b/x86_64-windows/dxgi.dll" "$b/x86_64-windows/d3d9.dll"
          rm "$b/SOURCE"
          so=$b/x86_64-unix/winemetal.so
          codesign --remove-signature "$so"
          printf '/llvm/lib/Support/APInt.cpp\0' >>"$so"
          perl -0777 -pi -e 's/(\x32\0\0\0.{4}\x01\0\0\0)\0\0\x0f\0/$1\0\0\x1a\0/s' "$so"
          perl -0777 -pi -e 's/(MTLB\x01\x80)\x02\0.\0/$1\x02\0\x09\0/s; s/(MTLB\x01\x80.*?VERS\x08\0)..../$1\x02\0\x09\0/s' \
            "$b/x86_64-windows/d3d12core.dll"
          status=0
          python3 -I .github/swtor/check-build.py "$b" >"$RUNNER_TEMP/broken.txt" || status=$?
          cat "$RUNNER_TEMP/broken.txt"
          [[ $status == 1 ]] && [[ $(grep -c '^FAIL' "$RUNNER_TEMP/broken.txt") == 7 ]]
          grep -qxF 'FAIL  missing file: SOURCE' "$RUNNER_TEMP/broken.txt"
          grep -qxF 'FAIL  unexpected file: x86_64-windows/d3d9.dll' "$RUNNER_TEMP/broken.txt"
          grep -qxF 'FAIL  x86_64-unix/winemetal.so: 1 LLVM source paths (assertion text)' "$RUNNER_TEMP/broken.txt"
          grep -qxF 'FAIL  x86_64-unix/winemetal.so: platform 1, minos 26.0 (macOS 15.0 expected)' "$RUNNER_TEMP/broken.txt"
          grep -q '^FAIL  x86_64-unix/winemetal\.so: no ad hoc signature that verifies' "$RUNNER_TEMP/broken.txt"
          grep -qE '^FAIL  x86_64-windows/d3d12core\.dll: internal metallib at 0x[0-9a-f]+: container 2\.9 ' "$RUNNER_TEMP/broken.txt"
          grep -qE '^FAIL  x86_64-windows/d3d12core\.dll: internal metallib at 0x[0-9a-f]+: [0-9]+ of [0-9]+ functions AIR 2\.7 Metal 3\.2, 1 AIR 2\.9 Metal 3\.2$' "$RUNNER_TEMP/broken.txt"
          # every host break: tests/breaks/host_<test>[.<n>].patch, found by its name, against host_<test>, so a new
          # one runs without a line here; and the converter's d3d12_bounds_guarded{,.2}.patch against
          # host_guard_static_ranges. each has to apply, and its test has to build and fail on it: meson's own count
          # of failed tests, as a build that fails, a timeout, a skip or a test meson doesn't know is no failure of
          # the test. host_tessellator's only when that test ran. the cases below also have to fail at their line
          missed=()
          ran=0
          for p in tests/breaks/host_*.patch tests/breaks/d3d12_bounds_guarded.patch tests/breaks/d3d12_bounds_guarded.2.patch; do
            name=$(basename "$p" .patch)
            if [[ $name == d3d12_bounds_guarded* ]]; then
              test=host_guard_static_ranges
            elif [[ $name =~ ^(host_[a-z0-9_]+)(\.[0-9]+)?$ ]]; then
              test=${BASH_REMATCH[1]}
            else
              missed+=("$p: not tests/breaks/host_<test>[.<n>].patch")
              continue
            fi
            if [[ $test == host_tessellator && $TESSELLATOR == left-out ]]; then
              echo "$p left out with host_tessellator"
              continue
            fi
            if ! git apply "$p"; then
              missed+=("$p: doesn't apply")
              continue
            fi
            meson test -C build "$test" --print-errorlogs >"$RUNNER_TEMP/$name.txt" 2>&1 || true
            git apply -R "$p"
            cat "$RUNNER_TEMP/$name.txt"
            ran=$((ran + 1))
            # lines: what it has to fail at, all of them; x: each a whole line
            x=
            case $name in
              # MULLION_LAYER_WAIT=0 waiting for the main thread again, a change compared only with the layer,
              # STATS' mainWaitMaxMs not reset, and it leaving out a change still waiting: at the call that waited,
              # the size that landed last, the call after the wait was taken, and the wait so far
              host_layer_apply) lines=('failed: returned >= 0 && returned < 100') ;;
              host_layer_apply.2) lines=('failed: CGSizeEqualToSize(layer.drawableSize, CGSizeMake(800, 600))') ;;
              host_layer_apply.3) lines=('failed: after == 0') ;;
              host_layer_apply.4) lines=('failed: waiting >= 1000 && waiting < 10000') ;;
              # MULLION_D3D12_GUARD_STATIC_RANGES leaving a static range's SRVs, UAVs or constant buffers unchecked,
              # at the guarded output; and the shader cache's key leaving out the compile flags
              d3d12_bounds_guarded* | host_guard_static_ranges)
                lines=('FAILED: static ranges with the flag convert as volatile ranges do') ;;
              host_compile_key) lines=("FAILED: the guard's flag alone gives another key") ;;
              # the bridge leaving out WMTTextureInfo.uncompressed; MULLION_TEX_MSAA_COMPRESSION=auto ignoring the
              # GPU family, or a resolve target's type group
              host_texture_compression) lines=('failed: uncompressed = 1 turns compression off') ;;
              host_compression) lines=('failed: auto keeps it on Apple10') ;;
              host_compression.2) lines=('failed: another group keeps compression') ;;
              # MULLION_D3D12_CHECK_RANGES with a range's end as offset + size, which wraps, a footprint of one slice
              # whatever its depth, a view's end as address + size, the bridge's Metal 4 length from an offset as
              # length - offset, which wraps past the end, a buffer made or released keeping the ranges, a root view's
              # bound past 32 bits, a table at its heap's end counted as in it, a command list's found buffer outliving
              # one, a table's span cut to its last range, and an ExecuteIndirect's last command counted as a whole
              # stride
              host_ranges) lines=('  Size 18446744073709551608 240') x=x ;;
              host_ranges.2) lines=('failed: a 3D footprint') ;;
              host_ranges.3) lines=('  Size 18446744073709551360 256') x=x ;;
              host_ranges.4) lines=('failed: nothing past its end, not a length that wraps') ;;
              host_ranges.5) lines=('failed: a buffer made or released forgets every range') ;;
              host_ranges.6) lines=('failed: a root view in a buffer of 5 GiB is bound at 4 GiB') ;;
              host_ranges.7) lines=("failed: a table at a heap's end is in no heap") ;;
              host_ranges.8) lines=('failed: a buffer released or made forgets the buffer found') ;;
              host_ranges.9) lines=("failed: a range placed before another doesn't shorten the table") ;;
              host_ranges.10) lines=('failed: four commands of stride 32 and 12 bytes of arguments take 108') ;;
              # the window lines with an activation alone written as d9mt's visibility line, what the watch said
              # last following only the lines it wrote, and an activation line clearing the count of lines left out
              host_window_lines) lines=("failed: an activation alone isn't a visibility line for the report") ;;
              host_window_lines.2) lines=('failed: the report reads the 11 left out') ;;
              host_window_lines.3) lines=('failed: the report reads the 2 left out after an activation line') ;;
              # SM50_SHADER_FLAG_CHECK_ROOT_RANGES leaving a root CBV, SRV or UAV unchecked, at that view; and a failed
              # check's load reading a root SRV's start instead of the lock table, at the trace of the loads
              host_check_root_ranges) lines=('FAILED: a root CBV is checked with the flag') ;;
              host_check_root_ranges.2) lines=('FAILED: a root SRV is checked with the flag') ;;
              host_check_root_ranges.3) lines=('FAILED: a root UAV is checked with the flag') ;;
              host_check_root_ranges.[4-7])
                lines=('FAILED: every load past a root SRV reads the lock table with the flag') ;;
              # and no descriptor index clamped, or a constant buffer's, an SRV's or a UAV's through a table, at that
              # kind, or a texture's, a sampler's or a UAV counter's, at the table they go through
              host_check_root_ranges.8)
                lines=("FAILED: a constant buffer's descriptor index is clamped with the flag"
                       "FAILED: an SRV's descriptor index is clamped with the flag"
                       "FAILED: a UAV's descriptor index is clamped with the flag"
                       'FAILED: every descriptor load through the resource table is clamped with the flag'
                       'FAILED: every descriptor load through the sampler table is clamped with the flag') ;;
              host_check_root_ranges.9)
                lines=("FAILED: a constant buffer's descriptor index is clamped with the flag") ;;
              host_check_root_ranges.10) lines=("FAILED: an SRV's descriptor index is clamped with the flag") ;;
              host_check_root_ranges.11) lines=("FAILED: a UAV's descriptor index is clamped with the flag") ;;
              host_check_root_ranges.1[24])
                lines=('FAILED: every descriptor load through the resource table is clamped with the flag') ;;
              host_check_root_ranges.13)
                lines=('FAILED: every descriptor load through the sampler table is clamped with the flag') ;;
              # #7's fixes undone: a pixel shader's unhandled dcl_input_ps_siv or dcl_input_ps_sgv copying v1 from an
              # argument never chosen, and a DXIL typed resource of doubles converted instead of refused
              host_converter_fixes) lines=('FAILED: an unhandled dcl_input_ps_siv converts and adds no argument') ;;
              host_converter_fixes.2) lines=('FAILED: an unhandled dcl_input_ps_sgv converts and adds no argument') ;;
              host_converter_fixes.3) lines=('FAILED: a DXIL typed SRV of doubles is refused as unsupported') ;;
              *) lines=() ;;
            esac
            if ! grep -qE '^Fail: +1 *$' "$RUNNER_TEMP/$name.txt"; then
              missed+=("$p: $test didn't fail on it")
            else
              for l in "${lines[@]}"; do
                grep -q${x}F -- "$l" "$RUNNER_TEMP/$name.txt" || missed+=("$p: $test failed, but not at: $l")
              done
            fi
          done
          for m in "${missed[@]}"; do echo "::error::$m"; done
          # exit, not a bare [[ ]]: this runner's /bin/bash is 3.2, whose -e doesn't stop on a false [[ ]]
          if [[ ${#missed[@]} != 0 || -n $(git status --porcelain -- src tools) ]]; then exit 1; fi
          echo "$ran host breaks, each failed its test"
          # a converter change the build's codegen id doesn't follow: this build against the id of the tree with one
          # comment more in src/airconv. both DLLs and VERSION have to fail
          cv=src/airconv/dxbc_converter.cpp
          echo '// control' >>"$cv"
          changed=$(python3 -I -B tools/codegen_id.py --llvm toolchains/llvm .)
          git checkout -- "$cv"
          status=0
          python3 -I .github/swtor/check-build.py install "$changed" >"$RUNNER_TEMP/codegen.txt" || status=$?
          cat "$RUNNER_TEMP/codegen.txt"
          [[ $status == 1 ]]
          [[ $(grep -c '^FAIL' "$RUNNER_TEMP/codegen.txt") == 3 ]]
          for f in d3d11.dll d3d12core.dll; do
            grep -qxF "FAIL  x86_64-windows/$f: carries the codegen id ${changed:0:12}" "$RUNNER_TEMP/codegen.txt"
          done
          grep -qxF "FAIL  VERSION: codegen ${changed:0:12}" "$RUNNER_TEMP/codegen.txt"
          echo "all five checks failed on their break, and $ran host breaks failed their tests"

      # last, so that a run that only adds a warning still shows everything above
      - name: No new warnings
        if: github.event_name == 'pull_request'
        run: .github/swtor/warnings.zsh build.log .github/swtor/warnings-x86_64.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mullion-swtor-${{ env.COMMIT }}
          path: install
          retention-days: 7
          if-no-files-found: error

  # packs the build into mullion-swtor-<commit>.tar.xz for every run, and for a push to swtor-on-mac adds it to the
  # pre-release swtor-builds: one asset per commit, never replaced, the 30 newest kept, never releases/latest.
  # the only job that may write to the repository. two pushes never upload at once: a push run's Publish waits
  # in a group of its own for the whole repository, and is never cancelled in progress. a pull request's Publish
  # uploads nothing and waits in its branch's group, so it never replaces a push's waiting Publish
  publish:
    name: Publish
    needs: [lint, build]
    concurrency:
      group: ${{ github.event_name == 'push' && 'swtor-publish' || format('swtor-publish-{0}', github.ref) }}
      cancel-in-progress: false
    # Lint runs for pull requests only
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.lint.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE: swtor-builds
      NAME: mullion-swtor-${{ github.event.pull_request.head.sha || github.sha }}.tar.xz
      DATE: ${{ needs.build.outputs.date }}
      # one thread: xz's output then doesn't depend on the runner's cores
      XZ_OPT: -T1
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mullion-swtor-${{ env.COMMIT }}
          path: dist
      - name: Pack
        run: |
          # VERSION as Stage wrote it: git describe of this commit, then commit:, codegen:, toolchain:, built:
          describe=$(sed -n 1p dist/VERSION)
          [[ $describe =~ ^v[0-9][^[:space:]]*-[0-9]+-g([0-9a-f]{7,})$ ]]
          [[ $COMMIT == "${BASH_REMATCH[1]}"* ]]
          [[ $(sed -n 2p dist/VERSION) == "commit: $COMMIT" ]]
          [[ $(cut -d: -f1 dist/VERSION | sed -n '3,$p' | paste -sd ' ' -) == 'codegen toolchain built' ]]
          # the artifact keeps no modes: directories and .so 755, the rest 644
          find dist -type d -exec chmod 755 {} +
          find dist -type f -exec chmod 644 {} +
          find dist -name '*.so' -exec chmod 755 {} +
          (cd dist && find . -type f | sort | xargs sha256sum) >"$RUNNER_TEMP/files.sha256"
          # the same files give the same archive: sorted names, one owner, the commit's time
          tar --sort=name --format=gnu --owner=0 --group=0 --numeric-owner --mtime="$DATE" -C dist -cJf "$NAME" \
            x86_64-windows x86_64-unix licenses LICENSE LICENSE-LLVM.txt SOURCE VERSION
          tar -tvJf "$NAME"
          # the archive unpacks to the artifact's files, sha256 for sha256, and nothing else
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xJf "$NAME" -C "$RUNNER_TEMP/unpacked"
          (cd "$RUNNER_TEMP/unpacked" && find . -type f | sort | xargs sha256sum) | diff "$RUNNER_TEMP/files.sha256" -
          cat "$RUNNER_TEMP/files.sha256"
          { echo '### Archive'; echo '```'; cat dist/VERSION; echo; sha256sum "$NAME"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload to the pre-release ${{ env.RELEASE }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/swtor-on-mac'
        run: |
          if ! gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release create "$RELEASE" --prerelease --latest=false --target "$COMMIT" \
              --title "SWTOR builds of my Mullion fork" --notes-file - <<'EOF'
          CI output for SWTOR on Mac's DirectX 12 client, not a release of Mullion: my fork's x86_64 build (the Windows
          DLLs and winemetal.so), built and checked by .github/workflows/swtor.yml for each push to swtor-on-mac. One
          asset per commit, mullion-swtor-<full sha>.tar.xz; the 30 newest stay. Its VERSION names the commit, the
          converter's codegen and the toolchain.

          The DLLs are built with llvm-mingw (clang), not with the gcc mingw-w64 that upstream's releases ship. Not for
          players: the app installs only a build it pins by SHA-256, and a pin reaches players only after the fork's GPU
          gate has passed on that commit (docs/swtor/README.md, Releases).
          EOF
          fi
          # a lightweight tag, which git describe (VERSION's first line) skips
          [[ $(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE" -q .object.type) == commit ]]
          [[ $(gh release view "$RELEASE" --json isPrerelease,isDraft -q '[.isPrerelease, .isDraft] | @tsv') == $'true\tfalse' ]]
          uploaded=0
          if gh release view "$RELEASE" --json assets -q '.assets[].name' | grep -qxF "$NAME"; then
            echo "$NAME is there already, and a published file is never replaced"
          else
            gh release upload "$RELEASE" "$NAME"
            uploaded=1
          fi
          # the 30 newest assets stay
          id=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE" -q .id)
          gh api --paginate "repos/$GH_REPO/releases/$id/assets?per_page=100" -q '.[] | [.created_at, .id, .name] | @tsv' |
            grep -P '\tmullion-swtor-[0-9a-f]{40}\.tar\.xz$' | sort -r | tail -n +31 | while IFS=$'\t' read -r _ asset old; do
              echo "deleting $old"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset"
            done
          read -r asset size digest < <(gh api "repos/$GH_REPO/releases/tags/$RELEASE" \
            -q ".assets[] | select(.name == \"$NAME\") | [.id, .size, .digest] | @tsv")
          [[ $digest == sha256:* ]]
          # what anyone downloads by URL is what GitHub reports, and, when this run uploaded it, this archive
          url="https://github.com/$GH_REPO/releases/download/$RELEASE/$NAME"
          # --retry-all-errors: a 404 too, in case the URL lags behind the upload
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/download.tar.xz" "$url"
          [[ $digest == "sha256:$(sha256sum "$RUNNER_TEMP/download.tar.xz" | cut -d' ' -f1)" ]]
          [[ $size == "$(stat -c %s "$RUNNER_TEMP/download.tar.xz")" ]]
          (( !uploaded )) || cmp "$RUNNER_TEMP/download.tar.xz" "$NAME"
          # 404 while no release but this pre-release exists; any other error fails the step
          if ! latest=$(gh api "repos/$GH_REPO/releases/latest" -q .tag_name 2>"$RUNNER_TEMP/latest.txt"); then
            grep -qF '(HTTP 404)' "$RUNNER_TEMP/latest.txt"
            latest=none
          fi
          echo "releases/latest: $latest"
          [[ $latest != "$RELEASE" ]]
          # the app's pin (src/som.sh)
          {
            echo '### Pin'
            echo '```'
            echo "MULLION_URL=$url"
            echo "MULLION_API_URL=https://api.github.com/repos/$GH_REPO/releases/assets/$asset"
            echo "MULLION_SIZE=$size"
            echo "MULLION_SHA256=${digest#sha256:}"
            echo "MULLION_COMMIT=$COMMIT"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
